<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430"><rect width="1000" height="430" fill="#eef3fa"/><text x="55" y="65" font-family="sans-serif" font-size="28" fill="#233149">从额度中断到继续执行</text><rect x="40" y="135" width="165" height="100" rx="18" fill="#b4f2dc"/><text x="52" y="192" font-family="sans-serif" font-size="19" fill="#233149">发现任务</text><text x="210" y="193" font-size="22">→</text><rect x="232" y="135" width="165" height="100" rx="18" fill="#c1d9ff"/><text x="244" y="192" font-family="sans-serif" font-size="19" fill="#233149">确认额度失败</text><text x="402" y="193" font-size="22">→</text><rect x="424" y="135" width="165" height="100" rx="18" fill="#e2d1ff"/><text x="436" y="192" font-family="sans-serif" font-size="19" fill="#233149">等待额度可用</text><text x="594" y="193" font-size="22">→</text><rect x="616" y="135" width="165" height="100" rx="18" fill="#ffdfba"/><text x="628" y="192" font-family="sans-serif" font-size="19" fill="#233149">提交继续请求</text><text x="786" y="193" font-size="22">→</text><rect x="808" y="135" width="165" height="100" rx="18" fill="#b4f2dc"/><text x="820" y="192" font-family="sans-serif" font-size="19" fill="#233149">确认实际执行</text><text x="50" y="330" font-family="sans-serif" font-size="22" fill="#56637a">连接失效、用户停止、普通失败：暂停并保留原因</text></svg>