name: Python tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: New-Item -ItemType Directory -Force data
      - run: python -m unittest discover -s tests
        env:
          PYTHONUTF8: '1'
